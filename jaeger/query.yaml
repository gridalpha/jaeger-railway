# Jaeger v2 query role -- the UI and the query API.
#
# Reads from the same OpenSearch backend the collector writes to. It runs no
# ingest pipeline, so the pipeline below is the nop receiver/exporter pair
# upstream uses for this role. It has no authentication of its own and takes no
# public domain: the Caddy gateway in this repository fronts it.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [nop]
      processors: [batch]
      exporters: [nop]
  telemetry:
    resource:
      service.name: jaeger-query
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: ${env:JAEGER_LOG_LEVEL:-info}

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: main_storage
      traces_archive: archive_storage
      # Drives the Monitor tab: Jaeger derives RED metrics from the span
      # indices themselves, so no Prometheus tier is needed.
      metrics: main_storage
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685
    max_clock_skew_adjust: ${env:JAEGER_MAX_CLOCK_SKEW_ADJUST:-0s}

  jaeger_storage:
    backends:
      main_storage: &opensearch_storage
        opensearch:
          server_urls:
            - ${env:OPENSEARCH_URL:-http://opensearch.railway.internal:9200}
          auth:
            basic:
              username: ${env:OPENSEARCH_USERNAME:-admin}
              password: ${env:OPENSEARCH_PASSWORD}
          indices:
            spans: &index_options
              date_layout: "2006-01-02"
              rollover_frequency: day
              shards: 1
              replicas: 0
            services: *index_options
            dependencies: *index_options
            sampling: *index_options
      # Where the UI's "Archive trace" button writes. Separate index prefix, so
      # the index cleaner's retention window does not reach it.
      archive_storage:
        opensearch:
          server_urls:
            - ${env:OPENSEARCH_URL:-http://opensearch.railway.internal:9200}
          auth:
            basic:
              username: ${env:OPENSEARCH_USERNAME:-admin}
              password: ${env:OPENSEARCH_PASSWORD}
          indices:
            index_prefix: jaeger-archive
    metric_backends:
      main_storage: *opensearch_storage

receivers:
  nop:

processors:
  batch:

exporters:
  nop:
